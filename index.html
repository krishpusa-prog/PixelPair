<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelPair | Visual Search Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 h-screen flex flex-col overflow-hidden text-slate-900">

    <div id="loading-screen" class="fixed inset-0 z-[100] bg-white flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="loader w-12 h-12 border-4 border-slate-200 rounded-full mb-4"></div>
        <p class="text-slate-600 font-medium animate-pulse">Initializing PixelPair Engine...</p>
    </div>

    <header class="bg-white border-b px-6 py-4 flex justify-between items-center shadow-sm z-50">
        <div class="flex items-center gap-3">
            <button id="mobile-toggle" class="md:hidden text-slate-600 text-xl">☰</button>
            <div class="logo-box">P²</div>
            <h1 class="text-xl font-extrabold tracking-tight">pixelPair</h1>
        </div>
        <div id="status-pill" class="status-offline">Engine Offline</div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <aside id="sidebar" class="sidebar-container">
            <div class="space-y-6 flex-1">
                <div>
                    <h3 class="sidebar-label">Data Management</h3>
                    <label class="import-zone">
                        <span>📥 Import Catalog</span>
                        <input type="file" id="folder-input" webkitdirectory directory multiple class="hidden">
                    </label>
                </div>
                
                <div class="stats-card">
                    <h3 class="sidebar-label">Local Index</h3>
                    <p class="text-3xl font-black text-indigo-600" id="db-count">0</p>
                    <p class="text-[11px] text-slate-500 mt-1">Vectors stored in browser</p>
                </div>

                <div>
                    <h3 class="sidebar-label">Similarity Filter</h3>
                    <input type="range" id="threshold-slider" min="0" max="100" value="50" class="slider">
                    <div class="flex justify-between text-[10px] font-bold text-slate-500 mt-2">
                        <span>0%</span>
                        <span id="threshold-value">50% Match</span>
                        <span>100%</span>
                    </div>
                </div>
            </div>

            <button id="clear-db" class="clear-btn">🗑️ Wipe Local Memory</button>
        </aside>

        <main class="flex-1 overflow-y-auto p-6 md:p-12">
            <div class="max-w-5xl mx-auto space-y-12">
                <section id="drop-zone" class="drop-zone group">
                    <div id="drop-prompt" class="text-center group-hover:scale-105 transition-transform">
                        <div class="text-6xl mb-4">🎯</div>
                        <p class="text-lg font-bold text-slate-700">Drop reference image</p>
                        <p class="text-sm text-slate-400">Instant on-device visual comparison</p>
                    </div>
                    <img id="search-preview" class="hidden-preview hidden">
                    <input type="file" id="file-input" class="hidden" accept="image/*">
                </section>

                <section>
                    <div class="flex items-center justify-between mb-8">
                        <h2 class="text-xl font-black text-slate-800">Visual Matches</h2>
                        <div class="h-px flex-1 bg-slate-200 mx-6"></div>
                    </div>
                    <div id="results-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                        <div class="col-span-full py-12 text-center text-slate-300 italic">No matches found.</div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <div id="lightbox" class="lightbox hidden">
        <img id="lightbox-img" src="" alt="Full View">
        <p id="lightbox-caption" class="text-white mt-4 font-mono text-sm"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
